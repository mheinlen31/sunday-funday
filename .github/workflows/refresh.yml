name: Daily ESPN refresh

on:
  # GitHub runs scheduled jobs on a best-effort basis and delays them heavily
  # under load — observed 1-8 HOURS late, worst at the top of the hour. So:
  # off-peak minutes, and several spread through the day, meaning a delayed run
  # is covered by the next one instead of leaving the league a day stale.
  # (data.js only commits when values actually change, so extras are free.)
  # All of these no-op after the Sept 2 values lock.
  schedule:
    - cron: '7 11 * * *'    #  6:07am Central
    - cron: '23 13 * * *'   #  8:23am Central
    - cron: '41 15 * * *'   # 10:41am Central
    - cron: '37 18 * * *'   #  1:37pm Central
    - cron: '19 22 * * *'   #  5:19pm Central
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh ESPN values
        run: python scripts/refresh_cloud.py
      - name: Commit and push if changed
        run: |
          git config user.name "sunday-funday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js
          if git diff --cached --quiet; then
            echo "No value changes today"
          else
            git commit -m "Daily ESPN refresh $(date -u +%Y-%m-%d)"
            git push
          fi
