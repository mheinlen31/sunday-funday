name: Daily ESPN refresh

on:
  schedule:
    - cron: '0 12 * * *'   # 7am Central (12:00 UTC) daily
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh ESPN values
        run: python scripts/refresh_cloud.py
      - name: Commit and push if changed
        run: |
          git config user.name "sunday-funday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js ./*.html
          if git diff --cached --quiet; then
            echo "No value changes today"
          else
            git commit -m "Daily ESPN refresh $(date -u +%Y-%m-%d)"
            git push
          fi
